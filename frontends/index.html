<script>
const token='__TOKEN__';let session=new URL(location.href).searchParams.get('session')||'default',epoch=0,polling=false,lastMessages='',running=false,cancelPending=false;
const $=s=>document.querySelector(s);

async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-GUI-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function items(target,values,empty){target.replaceChildren(...(values.length?values.map(x=>node('div',x,'item')):[node('div',empty,'muted')]))}
function markdown(text){const body=node('div','','body markdown');body.innerHTML=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:false}),{ALLOWED_TAGS:['p','br','strong','em','del','s','h1','h2','h3','h4','h5','h6','ul','ol','li','blockquote','pre','code','a','table','thead','tbody','tr','th','td','hr','input'],ALLOWED_ATTR:['href','title','class','type','checked','disabled','start','align'],FORBID_TAGS:['style','script'],ALLOW_DATA_ATTR:false});body.querySelectorAll('a').forEach(a=>{if(!/^(https?:|mailto:|#|\/)/i.test(a.getAttribute('href')||''))a.removeAttribute('href');a.target='_blank';a.rel='noopener noreferrer'});body.querySelectorAll('input').forEach(i=>{i.type='checkbox';i.disabled=true});return body}
function pretty(value){try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value||'暂无结果'}}
function renderEntries(box,messages){const opened=new Set([...box.querySelectorAll('details[open]')].map(d=>d.dataset.id));const fragment=document.createDocumentFragment();let group=null;for(const m of messages){if(m.role==='tool'){if(!group){group=node('div','','tool-group');fragment.append(group)}const d=node('details','','tool-entry');d.dataset.id=m.id;d.dataset.status=m.status;d.open=opened.has(m.id);const summary=node('summary','');const titles={calculator:'计算器',file_read:'文件读取',file_write:'文件写入',todo:'待办',plan:'计划',checkpoint:'工作记忆',code_run:'代码执行',web_scan:'浏览器',web_execute_js:'浏览器',ask_user:'用户确认'};summary.append(node('span','⌘','tool-icon'),node('span',({completed:'已使用',failed:'调用',running:'正在使用',unknown:'已调用'}[m.status]||'调用')+' '+(titles[m.name]||m.name)+(m.status==='failed'?'，执行失败':m.status==='unknown'?'，结果未确认':' 执行了命令'),'tool-name'));summary.title=m.name;summary.querySelector('.tool-icon').innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg>';const detail=node('div','','tool-detail');detail.append(node('h4','参数'),node('pre',pretty(m.arguments)),node('h4','结果'),node('pre',pretty(m.result)));d.append(summary,detail);group.append(d)}else{group=null;const div=node('div','','message '+m.role);if(m.role==='assistant')div.append(markdown(m.content));else div.append(node('div',m.content,'body'));fragment.append(div)}}box.replaceChildren(fragment)}
function renderMessages(box,messages,currentPlan=null){
 const completedPlans=new Map();
 for(const message of messages){if(message.role!=='tool'||message.name!=='plan')continue;try{const result=JSON.parse(message.result);const plan=result.ok&&result.data?.plan;if(plan?.status==='completed'&&!completedPlans.has(plan.id))completedPlans.set(plan.id,{plan,turn:message.turn})}catch{}}

 const states=new Map([...box.querySelectorAll('details')].map(d=>[d.dataset.id,{open:d.open,phase:d.dataset.phase}]));
 const fragment=document.createDocumentFragment();const turns=new Map();
 for(const m of messages){const key=m.turn??0;if(!turns.has(key))turns.set(key,[]);turns.get(key).push(m)}
 function append(target,entries){const holder=document.createElement('div');renderEntries(holder,entries);target.append(...holder.childNodes)}
 for(const [id,entries] of turns){
  const users=entries.filter(m=>m.role==='user');const work=entries.filter(m=>m.role!=='user');append(fragment,users);
  const finished=entries.every(m=>m.finished);const last=work.at(-1);const final=finished&&last?.role==='assistant'?last:null;
  const process=final?work.slice(0,-1):work;
  if(process.length){const fold=node('details','','process');fold.dataset.id='process:'+id;fold.dataset.phase=finished?'done':'running';
   const previous=states.get(fold.dataset.id);fold.open=previous?.phase===fold.dataset.phase?previous.open:!finished;
   const summary=node('summary','');const count=process.filter(m=>m.role==='tool').length;
   summary.append(node('span',finished?'执行过程':'正在处理','process-title'));const chevron=document.createElementNS('http://www.w3.org/2000/svg','svg');chevron.setAttribute('viewBox','0 0 16 16');chevron.setAttribute('class','process-chevron');chevron.setAttribute('aria-hidden','true');chevron.innerHTML='<path d="m6 4 4 4-4 4"/>';summary.append(chevron);
   const content=node('div','','process-content');append(content,process);fold.append(summary,content);fragment.append(fold);
  }

  for(const entry of completedPlans.values())if(entry.turn===id)renderPlan(fragment,entry.plan);
 }
 if(currentPlan&&currentPlan.status!=='completed')renderPlan(fragment,currentPlan);
 box.replaceChildren(fragment);
 for(const d of box.querySelectorAll('.tool-entry')){const previous=states.get(d.dataset.id);if(previous)d.open=previous.open}
}
const planFoldState=new Map();
function renderPlan(box,plan){
 if(!plan)return;
 const key=session+':'+plan.id;
 const completed=plan.status==='completed';
 const previous=planFoldState.get(key);
 const card=node('details','',completed?'chat-plan completed-plan':'chat-plan');
 card.open=previous?.status===plan.status?previous.open:plan.status==='active';
 planFoldState.set(key,{status:plan.status,open:card.open});
 card.addEventListener('toggle',()=>{if(card.isConnected)planFoldState.set(key,{status:plan.status,open:card.open})});
 const done=plan.steps.filter(step=>step.status==='completed').length;
 const summary=node('summary','');const heading=node('div','','plan-heading');if(completed){heading.append(node('span','计划已完成','plan-title'));summary.title=plan.title}else heading.append(node('span','执行计划','plan-caption'),node('span',plan.title,'plan-title'));
 const progress=node('span',plan.status==='cancelled'?'已取消':done+'/'+plan.steps.length,'plan-progress');
 const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 16 16');arrow.setAttribute('class','plan-chevron');arrow.setAttribute('aria-hidden','true');arrow.innerHTML='<path d="m6 4 4 4-4 4"/>';
 summary.append(heading);if(!completed)summary.append(progress);summary.append(arrow);card.append(summary);
 const list=node('ol','','plan-steps');if(completed)list.append(node('li',plan.title,'completed-plan-title'));for(const step of plan.steps){const row=node('li','','plan-step');row.dataset.status=step.status;row.append(statusDot(step.status),node('span',step.title));if(step.status==='in_progress')row.append(node('span','进行中','plan-step-status'));list.append(row)}card.append(list);box.append(card);
}
function statusDot(status){const dot=node('span','','status-dot');dot.dataset.status=status;dot.setAttribute('aria-label',{completed:'已完成',in_progress:'进行中',pending:'未完成'}[status]||status);return dot}
function renderTodos(todos){$('#todos').replaceChildren(...todos.map(todo=>{const row=node('div','','todo-row');row.append(statusDot(todo.done?'completed':'pending'),node('span',todo.title));return row}))}
let sessionListSignature='';
function renderSessions(sessions,current){
 const signature=JSON.stringify([sessions.map(item=>[item.name,item.title]),current]);
 if(signature===sessionListSignature)return;
 sessionListSignature=signature;
 $('#sessions').replaceChildren(...sessions.map(item=>{const row=node('div','','session-row'+(item.name===current?' selected':''));
 const button=node('button',item.title||item.name,'session-select');button.title=item.title||item.name;button.onclick=()=>{session=item.name;rememberSession();cancelPending=false;epoch++;lastMessages='';refresh()};
 const more=node('button','','session-more');more.innerHTML='<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/></svg>';more.setAttribute('aria-label','会话选项：'+(item.title||item.name));more.onclick=e=>{e.stopPropagation();openSessionMenu(more,item)};row.append(button,more);return row}))
}
function openSessionMenu(button,item){document.querySelector('.session-menu')?.remove();const menu=node('div','','session-menu');menu.setAttribute('role','menu');for(const [label,action] of [['重命名','rename'],['删除对话','delete']]){const b=node('button',label,action==='delete'?'danger':'');b.setAttribute('role','menuitem');b.onclick=()=>{menu.remove();sessionDialog(item,action)};menu.append(b)}document.body.append(menu);const rect=button.getBoundingClientRect();menu.style.left=Math.min(rect.left,innerWidth-160)+'px';menu.style.top=Math.min(rect.bottom+4,innerHeight-100)+'px';setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0)}
function sessionDialog(item,action){
 document.querySelector('#session-dialog')?.remove();const dialog=node('dialog','','session-dialog');dialog.id='session-dialog';const form=node('form','');const title=node('h2',action==='rename'?'重命名对话':'删除对话？');const input=node('input','');input.value=item.title||item.name;input.maxLength=100;input.setAttribute('aria-label','会话名称');
 const description=node('p',action==='delete'?'“'+(item.title||item.name)+'”将从会话列表移除。':'');const error=node('div','','dialog-error');error.setAttribute('role','alert');const actions=node('div','','dialog-actions');const cancel=node('button','取消');cancel.type='button';cancel.onclick=()=>dialog.close();const submit=node('button',action==='rename'?'保存':'删除',action==='delete'?'danger':'primary');submit.type='submit';actions.append(cancel,submit);form.append(title);if(action==='rename')form.append(input);else form.append(description);form.append(error,actions);dialog.append(form);dialog.addEventListener('close',()=>dialog.remove());
 form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const result=await api('/api/'+action,{session:item.name,title:input.value});if(action==='delete'&&session===item.name){session=result.next_session;rememberSession();epoch++;lastMessages='';cancelPending=false}dialog.close();refresh()}catch(err){error.textContent=err.message;submit.disabled=false}};
 document.body.append(dialog);dialog.showModal();if(action==='rename'){input.focus();input.select()}else cancel.focus();
}
let questionSignature='';
function renderQuestion(question){
 const signature=session+':'+(question?.id||'');if(signature===questionSignature)return;questionSignature=signature;
 const panel=$('#question-panel');panel.replaceChildren();panel.hidden=!question;document.querySelector('.layout').classList.toggle('has-question',!!question);if(!question)return;
 const name=session;let selected=null,busy=false;const form=node('form','','question-form');
 const header=node('div','','question-header');const label=node('div','','question-label');label.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8.5 8.5 0 0 1-12.7 7.4L4 20l1.1-3.3A8.5 8.5 0 1 1 20 11.5Z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 1.5-2.5 3m0 3h.01"/></svg><span>问题</span>';
 const close=node('button','×','question-close');close.type='button';close.title='跳过此问题';close.setAttribute('aria-label','跳过此问题');header.append(label,close);
 const title=node('div',question.question,'question-title');const choices=node('div','','question-options');choices.setAttribute('role','group');choices.setAttribute('aria-label','建议回答');
 const footer=node('div','','question-footer');const inputWrap=node('div','','question-input');const pen=node('span','','question-pen');pen.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5M4 20l5-1L20 8a2 2 0 0 0-5-5L4 14Z"/></svg>';
 const input=node('textarea','');input.rows=1;input.maxLength=6000;input.placeholder='或自行撰写回复';input.setAttribute('aria-label','自行撰写回复');inputWrap.append(pen,input);
 const skip=node('button','跳过','question-skip');skip.type='button';const submit=node('button','发送','question-submit');submit.type='submit';submit.disabled=true;
 function update(){submit.disabled=busy||(!input.value.trim()&&selected===null);choices.querySelectorAll('button').forEach((button,index)=>{button.classList.toggle('chosen',index===selected);button.setAttribute('aria-pressed',String(index===selected))})}
 question.options.forEach((option,index)=>{const button=node('button','','question-option');button.type='button';button.setAttribute('aria-pressed','false');button.append(node('span',String(index+1),'question-number'),node('span',option,'question-option-text'));button.onclick=()=>{if(busy)return;selected=index;input.value='';update()};choices.append(button)});
 input.oninput=()=>{selected=null;input.style.height='28px';input.style.height=Math.min(100,input.scrollHeight)+'px';update()};
 const error=node('div','','dialog-error');error.setAttribute('role','alert');
 async function send(skipped){if(busy)return;const answer=skipped?'用户跳过了此问题，未作选择。不要代替用户决定；如果缺少必要信息，请说明限制。':input.value.trim()||(selected!==null?question.options[selected]:'');if(!answer)return;busy=true;skip.disabled=true;close.disabled=true;input.disabled=true;choices.querySelectorAll('button').forEach(b=>b.disabled=true);update();try{await api('/api/answer',{session:name,question_id:question.id,answer});if(session===name){panel.hidden=true;document.querySelector('.layout').classList.remove('has-question');refresh()}}catch(err){busy=false;error.textContent=err.message;skip.disabled=false;close.disabled=false;input.disabled=false;choices.querySelectorAll('button').forEach(b=>b.disabled=false);update()}}
 skip.onclick=()=>send(true);close.onclick=()=>send(true);form.onsubmit=e=>{e.preventDefault();send(false)};
 input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(false)}};
 footer.append(inputWrap,skip,submit);form.append(header,title,choices,footer,error);panel.append(form);
}
async function refresh(){if(polling)return;polling=true;const e=epoch,name=session;try{const s=await api('/api/state?session='+encodeURIComponent(name));if(e!==epoch)return;document.querySelector('.layout').classList.toggle('has-todos',s.todos.length>0);$('#sessionName').textContent=s.title||name;rememberSession();renderSessions(s.sessions,name);const signature=JSON.stringify([s.messages,s.plan]);if(signature!==lastMessages){const box=$('#messages'),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;renderMessages(box,s.messages,s.plan);if(!s.messages.length){const empty=node('div','','empty');empty.append(node('h2','有什么可以帮你？'),node('p','提问、处理任务，或记录待办。'));box.append(empty);}if(bottom)box.scrollTop=box.scrollHeight;lastMessages=signature}renderTodos(s.todos);renderQuestion(s.question);setRunning(!!s.job.running);$('#status').dataset.idle=String(!s.job.running);$('#status').textContent=s.job.running?(cancelPending?'正在停止…':s.question?'等待你的回答…':'正在处理…'):'';$('#error').textContent=s.job.error||''}catch(err){if(e===epoch){if(err.message==='会话不存在'&&session!=='default'){session='default';rememberSession();epoch++;lastMessages=''}else $('#error').textContent=err.message}}finally{polling=false;if(e!==epoch)refresh()}}
$('#new').onclick=async()=>{const button=$('#new');button.disabled=true;const name='chat-'+crypto.randomUUID();try{await api('/api/new',{session:name});session=name;rememberSession();cancelPending=false;epoch++;lastMessages='';await refresh();$('#composer-form textarea').focus()}catch(e){$('#error').textContent=e.message}finally{button.disabled=false}};
function setRunning(value){running=value;if(!value)cancelPending=false;const button=$('#send');button.disabled=cancelPending;button.type=value?'button':'submit';button.setAttribute('aria-label',value?'停止生成':'发送消息');button.title=value?'停止生成':'发送 · Enter';button.innerHTML=value?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>'}
$('#send').onclick=async()=>{if(!running||cancelPending)return;const name=session;cancelPending=true;setRunning(true);try{await api('/api/cancel',{session:name});if(session===name)$('#status').textContent='正在停止…'}catch(e){if(session===name){cancelPending=false;setRunning(running);$('#error').textContent=e.message}}};
$('#composer-form').onsubmit=async e=>{e.preventDefault();if(running||$('#send').disabled)return;const text=$('#composer-form textarea').value;if(!text.trim())return;$('#send').disabled=true;try{await api('/api/send',{session,text});$('#composer-form textarea').value='';resizeComposer();setRunning(true);refresh()}catch(e){$('#error').textContent=e.message;setRunning(false)}};
function resizeComposer(){const input=$('#composer-form textarea');input.style.height='30px';input.style.height=Math.min(180,Math.max(30,input.scrollHeight))+'px';input.style.overflowY=input.scrollHeight>180?'auto':'hidden'}
$('#composer-form textarea').addEventListener('input',resizeComposer);
$('#composer-form textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!running)$('#composer-form').requestSubmit()}};
refresh();setInterval(refresh,1200);
